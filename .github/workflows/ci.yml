name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows build and package
    runs-on: windows-latest

    env:
      LUAJIT_BIN_DIR: ${{ github.workspace }}\.lua
      LUAJIT_SRC_DIR: vendor/luajit/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Update Deps
        shell: pwsh
        run: .\update_vendor.ps1

      - name: Checkout cimgui
        shell: pwsh
        run: |
          git clone --recursive --branch docking_inter https://github.com/cimgui/cimgui.git "$env:RUNNER_TEMP\cimgui"

      - name: Build cimgui Win32/DX11 DLL
        shell: pwsh
        run: |
          cmake -S tools/cimgui_win32_dx11 -B build-cimgui -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCIMGUI_ROOT="$env:RUNNER_TEMP\cimgui"
          cmake --build build-cimgui --config Release

      - name: Cache LuaJIT
        id: cache-luajit
        uses: actions/cache@v4
        with:
          path: ${{ env.LUAJIT_BIN_DIR }}
          key: ${{ runner.os }}-luajit-gc64-${{ hashFiles('vendor/luajit/.git') }}

      - name: Build LuaJIT (Dynamic CRT)
        if: steps.cache-luajit.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd %LUAJIT_SRC_DIR%
          call msvcbuild.bat gc64

          mkdir "%LUAJIT_BIN_DIR%\bin"
          mkdir "%LUAJIT_BIN_DIR%\lib"
          mkdir "%LUAJIT_BIN_DIR%\include"
          mkdir "%LUAJIT_BIN_DIR%\jit"

          copy lua51.dll "%LUAJIT_BIN_DIR%\bin\"
          copy luajit.exe "%LUAJIT_BIN_DIR%\bin\"
          copy lua51.lib "%LUAJIT_BIN_DIR%\lib\"

          copy lua.h "%LUAJIT_BIN_DIR%\include\"
          copy lualib.h "%LUAJIT_BIN_DIR%\include\"
          copy lauxlib.h "%LUAJIT_BIN_DIR%\include\"
          copy luaconf.h "%LUAJIT_BIN_DIR%\include\"
          copy luajit.h "%LUAJIT_BIN_DIR%\include\"
          copy lua.hpp "%LUAJIT_BIN_DIR%\include\"
          copy jit\*.lua "%LUAJIT_BIN_DIR%\jit\"

      - name: Disable Windows Defender
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableArchiveScanning $true

      - name: Cache CMake Build
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'src/**/*.hpp') }}

      - name: Build PEShell
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Assemble Package
        shell: pwsh
        run: |
          $pkg = New-Item -ItemType Directory -Path "package" -Force
          $bin = New-Item -ItemType Directory -Path "$pkg/bin" -Force
          $lua = New-Item -ItemType Directory -Path "$pkg/share/lua/5.1" -Force
          $lib = New-Item -ItemType Directory -Path "$lua/lib" -Force
          $jit = New-Item -ItemType Directory -Path "$lua/jit" -Force

          Copy-Item "build/bin/peshell.exe" $bin -Force
          Copy-Item "${{ env.LUAJIT_BIN_DIR }}\bin\lua51.dll" $bin -Force
          $cimguiCandidates = @(
            "cimgui.dll",
            "build-cimgui/cimgui.dll",
            "build/bin/cimgui.dll",
            "vendor/cimgui/cimgui.dll"
          )
          foreach ($candidate in $cimguiCandidates) {
            if (Test-Path $candidate) {
              Copy-Item $candidate $bin -Force
              Write-Host "Packaged cimgui.dll from $candidate"
              break
            }
          }
          if (Test-Path "start_peshell_main.bat") { Copy-Item "start_peshell_main.bat" $pkg }

          Copy-Item "scripts/core" "$lua/core" -Recurse -Force
          Copy-Item "scripts/plugins" "$lua/plugins" -Recurse -Force
          Copy-Item "scripts/profiles" "$lua/profiles" -Recurse -Force
          Copy-Item "scripts/lib/*" "$lua/lib/" -Recurse -Force
          Copy-Item "scripts/*.lua" $lua -Force
          Copy-Item "${{ env.LUAJIT_BIN_DIR }}\jit\*.lua" $jit

          Copy-Item "vendor/lua-ext" "$lib/ext" -Recurse -Exclude .git,vendor
          Copy-Item "vendor/lua-ffi-bindings" "$lib/ffi" -Recurse -Exclude .git,vendor

          # Optional vendor libs (guard with Test-Path)
          if (Test-Path "vendor/proc_utils/proc_utils_ffi.lua") { Copy-Item "vendor/proc_utils/proc_utils_ffi.lua" $lib }
          if (Test-Path "vendor/lfs/lfs_ffi.lua") { Copy-Item "vendor/lfs/lfs_ffi.lua" $lib }
          if (Test-Path "vendor/luaunit/luaunit.lua") { Copy-Item "vendor/luaunit/luaunit.lua" $lib }

          if (Test-Path "../win-kit") {
            Copy-Item "../win-kit" "$lua/win-kit" -Recurse -Exclude .git
          }
          if (Test-Path "../win-utils") {
            Copy-Item "../win-utils" "$lua/win-utils" -Recurse -Exclude .git
          }

          $vctools = $env:VCToolsRedistDir
          $crt = Join-Path $vctools "x64/Microsoft.VC14*.CRT"
          Write-Host "Copying CRT from $crt"
          Copy-Item "$crt/*.dll" $bin -Force

          echo "PACKAGE_PATH=$pkg" >> $env:GITHUB_ENV

      - name: Smoke Test
        working-directory: ${{ env.PACKAGE_PATH }}
        shell: pwsh
        run: |
          .\bin\peshell.exe run share\lua\5.1\test_profile_runner.lua
          .\bin\peshell.exe run share\lua\5.1\test_gui.lua
          if (Test-Path ".\bin\cimgui.dll") {
            .\bin\peshell.exe run share\lua\5.1\test_imgui_native_smoke.lua
          } else {
            Write-Host "cimgui.dll is not packaged; skipping imgui-native-smoke."
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peshell-release
          path: ${{ env.PACKAGE_PATH }}

  lua-smoke:
    name: Lua smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Profile runner smoke
        run: |
          luajit scripts/test_profile_runner.lua
          luajit scripts/test_gui.lua

      - name: Lua syntax smoke
        run: |
          luajit -e "assert(loadfile('scripts/prelude.lua')); assert(loadfile('scripts/init.lua')); assert(loadfile('scripts/lib/tasks/runner.lua')); assert(loadfile('scripts/profiles/default.lua'))"
